services:
  api:
    build: ./backend
    container_name: cybersentinel_api
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  streamlit:
    build: ./frontend
    container_name: cybersentinel_streamlit
    env_file:
      - ./.env
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: cybersentinel_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2-20
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
    ports:
      - "8081:8081"
    depends_on:
      - mongo

volumes:
  mongo_data:


